# ==========================================================
#             PREMIAÇÕES E REGRAS DA ARENA
# ==========================================================

# Quantia de dinheiro que o grande vencedor do evento receberá.
premio: 50000.0

# Quantia de dinheiro dada ao segundo colocado (o penúltimo jogador que sobrou de pé).
premio-penultimo: 15000.0

# Quantidade mínima de jogadores necessária para que o comando "/evento pvp iniciar" funcione.
minimo-jogadores: 1

# Tempo de espera (em SEGUNDOS) após o anúncio do vencedor antes que todos os jogadores 
# sejam teleportados de volta e o evento seja totalmente limpo/encerrado.
# NOTA: Os efeitos visuais de vitória do jogador vão durar exatamente este mesmo tempo!
tempo-espera-vencedor: 30

# ==========================================================
#          SISTEMA DE PREPARAÇÃO (FOLGA ANTES DA LUTA)
# ==========================================================
preparacao:
  # Ativar tempo de folga/preparação ao iniciar o evento? (true = sim, false = não)
  utilizar-preparacao: true

  # Duração da contagem regressiva de preparação (em SEGUNDOS) antes de liberar o PvP.
  tempo-preparacao: 5

# ==========================================================
#           SISTEMA DE CRONÔMETRO E CONTAGEM REGRESSIVA
# ==========================================================
cronometro:
  # Ativar ou desativar o limite de tempo e o empate por decurso de prazo.
  batalha-com-tempo: true

  # Tempo máximo de duração da luta na arena (em SEGUNDOS) antes de forçar um empate.
  duracao-maxima-batalha: 600

  # Modo de exibição na ActionBar:
  # false = Mostra o tempo todo o cronômetro rodando desde o início da luta.
  # true  = Só começa a exibir a contagem na ActionBar quando o tempo estiver acabando.
  exibir-apenas-no-final: false

  # Define a partir de quantos SEGUNDOS restantes o cronômetro é considerado "quase esgotando".
  segundos-aviso-final: 10

# ==========================================================
#                  DEMAIS CONFIGURAÇÕES
# ==========================================================

    - "&e/evento pvp entrar &7- Participar do evento aberto."
    - "&e/evento pvp sair &7- Sair do evento e voltar ao ponto anterior."
    - "&c/evento pvp abrir &7- Abre as inscrições do evento pvp."
    - "&c/evento pvp iniciar &7- Teleporta e inicia os contadores de luta."

  efeito-invalido: "&cNome de efeito inválido do Minecraft. Use nomes como SPEED, JUMP_BOOST, etc."
  efeitos-limpos: "&aTodos os efeitos da arena foram removidos."

broadcasts:
  evento-aberto: "&aEvento PvP aberto! Digite &e/evento pvp entrar &apara participar."
  batalha-comecou: "&cA batalha começou na arena! Que vença o melhor."
  evento-encerrado: "&cO evento foi encerrado por um administrador."
  vencedor: "&6%player% venceu o Evento PvP!"
  penultimo: "&e%player% ficou em segundo lugar (penúltimo de pé) e garantiu uma recompensa!"

comandos:
  lobby: "warp evento_lobby %player%"
  arena: "warp evento_arena %player%"
  spec: "warp evento_spec %player%"
  dar-premio: "eco give %player% %premio%"
  dar-premio-penultimo: "eco give %player% %premio%"